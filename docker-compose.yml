services:
  db:
    image: postgres:16-alpine
    container_name: tipulim-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tipulim
      POSTGRES_PASSWORD: tipulim
      POSTGRES_DB: tipulim
    ports:
      - "5432:5432"
    volumes:
      - tipulim-pgdata:/var/lib/postgresql/data

volumes:
  tipulim-pgdata:
