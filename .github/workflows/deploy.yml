name: Deploy (Cloudflare Workers + Supabase)

# Full install/deploy pipeline. Runs on GitHub's runners (which can reach the
# Supabase database and the Cloudflare API), so no local steps are needed.
on:
  push:
    branches: [claude/inspiring-hamilton-grt2tj]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # 1) Apply database migrations to Supabase (session pooler, port 5432).
      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
        run: npx prisma migrate deploy

      # 2) Build for the Workers runtime and deploy.
      - name: Build & deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy

      # 3) Push runtime secrets onto the Worker (idempotent; only non-empty).
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          APP_URL: ${{ secrets.APP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          # (continued below)
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          INVOICE_API_URL: ${{ secrets.INVOICE_API_URL }}
          INVOICE_API_KEY: ${{ secrets.INVOICE_API_KEY }}
          INVOICE_WEBHOOK_SECRET: ${{ secrets.INVOICE_WEBHOOK_SECRET }}
        run: |
          put() {
            if [ -n "$2" ]; then
              printf '%s' "$2" | npx wrangler secret put "$1"
            fi
          }
          put DATABASE_URL "$DATABASE_URL"
          put AUTH_SECRET "$AUTH_SECRET"
          put ENCRYPTION_KEY "$ENCRYPTION_KEY"
          put APP_URL "$APP_URL"
          put RESEND_API_KEY "$RESEND_API_KEY"
          put EMAIL_FROM "$EMAIL_FROM"
          put GEMINI_API_KEY "$GEMINI_API_KEY"
          put GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          put GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put GOOGLE_REDIRECT_URI "$GOOGLE_REDIRECT_URI"
          put INVOICE_API_URL "$INVOICE_API_URL"
          put INVOICE_API_KEY "$INVOICE_API_KEY"
          put INVOICE_WEBHOOK_SECRET "$INVOICE_WEBHOOK_SECRET"
